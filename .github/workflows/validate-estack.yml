name: Validate Estack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: estack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variants:
    name: validate (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: codex, variant: estack}
          - {platform: devin, variant: estack-devin}
          - {platform: factory, variant: estack-factory}
          - {platform: cursor, variant: estack-cursor}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - run: bun scripts/check-estack.mjs '${{ matrix.platform }}'
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ${{ matrix.variant }}/skills/poteto-mode/scripts
      - run: bun test orch watch-pr
        working-directory: ${{ matrix.variant }}/skills/poteto-mode/scripts
      - run: bun run typecheck
        working-directory: ${{ matrix.variant }}/skills/poteto-mode/scripts
      - name: Fetch verified TLC
        shell: bash
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools-1.7.4.jar
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$TLA2TOOLS"
          printf '%s  %s\n' \
            936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88 \
            "$TLA2TOOLS" | sha256sum --check --strict
      - run: node --test '${{ matrix.variant }}/skills/statechart/scripts/test/statechart.test.mjs'
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools-1.7.4.jar
      - run: git diff --exit-code && git diff --check

  loader:
    name: package tests and Codex discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: bun test scripts/*.test.ts
      - run: node --test scripts/ui-review.test.mjs
      - name: Install pinned Codex CLI tooling
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --ignore-scripts \
            --no-audit --no-fund @openai/codex@0.164.0
          printf '%s\n' "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bun scripts/check-estack-loader.mjs
      - name: Validate Cursor metadata with the official checker
        shell: bash
        run: |
          validation_dir="$RUNNER_TEMP/cursor-validator"
          source_url=https://raw.githubusercontent.com/cursor/plugins/99b609a72323b70204eab407c622f436e858e112
          mkdir -p "$validation_dir/scripts" "$validation_dir/schemas"
          curl --fail --location --silent --show-error \
            "$source_url/scripts/validate-plugins.mjs" \
            --output "$validation_dir/scripts/validate-plugins.mjs"
          for schema in marketplace plugin; do
            curl --fail --location --silent --show-error \
              "$source_url/schemas/$schema.schema.json" \
              --output "$validation_dir/schemas/$schema.schema.json"
          done
          cp -R .cursor-plugin estack-cursor "$validation_dir/"
          npm install --prefix "$validation_dir" --ignore-scripts --no-audit --no-fund \
            ajv@8.17.1 ajv-formats@3.0.1
          node "$validation_dir/scripts/validate-plugins.mjs"
      - run: git diff --exit-code && git diff --check
