<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI review</title><link rel="stylesheet" href="review.css"></head>
<body>
<aside><nav aria-label="Screens" id="screens"></nav></aside>
<main>
<nav class="review-views" aria-label="Review views"><a id="comparison-view" href="#" aria-current="page">Comparisons</a><a id="final-view" href="#final-ui">Final UI</a></nav>
<div id="comparison-content">
<header><div class="heading"><h1 id="title"></h1><div class="controls"><select id="round" aria-label="Review round"></select><button id="previous" aria-label="Previous screen">←</button><span id="position"></span><button id="next" aria-label="Next screen">→</button></div></div><p id="explanation"></p></header>
<div class="toolbar review-toolbar">
  <div id="approval-controls" hidden>
    <label><input id="approve-current" type="checkbox" disabled> Looks good to me</label>
    <button id="approve-next" type="button" disabled>Looks good &amp; next</button>
    <span id="approval-status" role="status"></span>
  </div>
  <label><input id="highlights" type="checkbox" checked> Highlight changes</label>
</div>
<p id="gap" role="note" hidden></p><section class="pair" id="pair" aria-label="UI comparison"></section>
<section id="wording" hidden><h2>The wording</h2><p id="diff"></p></section>
<div id="video"></div>
<section id="feedback" aria-labelledby="feedback-title" hidden>
  <div class="feedback-heading"><h2 id="feedback-title">Comments</h2><button id="export-feedback" type="button" disabled>Download feedback</button></div>
  <ul id="comments"></ul>
  <form id="comment-form">
    <label for="comment-text">Comment on this view</label>
    <textarea id="comment-text" rows="3" maxlength="4000" required></textarea>
    <button id="submit-comment" type="submit">Add comment</button>
  </form>
  <p id="feedback-status" role="status"></p>
</section>
</div>
<section id="final-content" aria-labelledby="final-title" hidden>
  <h1 id="final-title">Final UI</h1>
  <p id="final-status" role="status"></p>
  <div id="final-gallery"></div>
</section>
<p id="error" role="alert"></p>
</main>
<dialog id="enlargement"><div class="toolbar"><h2 id="enlarged-label"></h2><button id="close">Close</button></div><div id="enlarged-image"></div></dialog>
<script type="module" src="review.js"></script>
</body></html>
