<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI review</title><link rel="stylesheet" href="review.css"></head>
<body>
<aside><nav aria-label="Screens" id="screens"></nav><select id="round" aria-label="Review round"></select></aside>
<main>
<header><div class="heading"><h1 id="title"></h1><div class="controls"><button id="previous" aria-label="Previous screen">←</button><span id="position"></span><button id="next" aria-label="Next screen">→</button></div></div><p id="explanation"></p></header>
<div class="toolbar"><label><input id="highlights" type="checkbox" checked> Highlight changes</label></div>
<p id="gap" role="note" hidden></p><section class="pair" id="pair" aria-label="UI comparison"></section>
<section id="wording" hidden><h2>The wording</h2><p id="diff"></p></section>
<div id="video"></div><p id="error" role="alert"></p>
</main>
<dialog id="enlargement"><div class="toolbar"><h2 id="enlarged-label"></h2><button id="close">Close</button></div><div id="enlarged-image"></div></dialog>
<script type="module" src="review.js"></script>
</body></html>
