<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>UI review</title>
<style>
  :root {
    color-scheme: light;
    --ink: #000;
    --page: #fff;
    --placeholder: #6b6b6b;
    --side: #F1EEFF;
    --side-hover: #E2DCFF;
    --accent: #6248FF;
    --accent-ink: #fff;
    --tip-meta: #CFC6FF;
    --before: #d64949;
    --after: #1f7a4c;
    --fixed: #1f7a4c;
    --open: #a0442a;
    --scrim: rgba(0, 0, 0, .92);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sidebar: 268px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--page); font: 14px/1.5 var(--sans); display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
  .label, aside p.round, nav summary, .meta, figcaption, label.field, .looks-good, .bar label, .earlier h3, .earlier .state, #tip small { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  aside { position: sticky; top: 0; align-self: start; height: 100dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--side); border-right: 2px solid var(--ink); padding: 20px 0; }
  aside h1 { font-size: 13px; font-weight: 800; margin: 0 20px 4px; }
  aside p.round { margin: 0 20px 16px; font-size: 10px; font-weight: 400; }
  nav details { border-top: 2px solid var(--ink); }
  nav details:last-child { border-bottom: 2px solid var(--ink); }
  nav summary { cursor: pointer; padding: 10px 20px 6px; font-size: 10px; list-style: none; }
  nav summary::-webkit-details-marker { display: none; }
  nav details[open] { padding-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 20px; font-size: 12px; color: var(--ink); text-decoration: none; }
  .row:hover { background: var(--side-hover); }
  .row[aria-current] { background: var(--ink); color: var(--page); font-weight: 700; }
  .row svg { flex: none; width: 13px; height: 13px; }
  .row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resize { position: fixed; top: 0; bottom: 0; left: calc(var(--sidebar) - 4px); width: 8px; cursor: col-resize; z-index: 5; touch-action: none; }
  .resize:hover, .resize.dragging { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  body.resizing { user-select: none; cursor: col-resize; }
  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: 320px; background: var(--ink); color: var(--page); box-shadow: 3px 3px 0 var(--accent); padding: 6px 9px; font: 600 12px/1.35 var(--sans); }
  #tip small { display: block; margin-top: 2px; font-size: 10px; color: var(--tip-meta); }
  main { padding: 32px 40px 140px; max-width: 1120px; min-width: 0; }
  .head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
  h2 { font-size: 24px; font-weight: 800; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 6px; }
  .meta { display: flex; gap: 12px; flex-wrap: wrap; font-weight: 400; }
  .looks-good { flex: none; display: flex; gap: 10px; align-items: center; padding: 6px 10px; border: 2px solid var(--ink); cursor: pointer; user-select: none; }
  .looks-good:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .looks-good input { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--ink); }
  .explain { margin: 14px 0 0; max-width: 70ch; }
  .look { margin: 8px 0 0; font-size: 13px; }
  .gap { margin: 10px 0 0; color: var(--open); font-size: 13px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 6px; }
  .shot { position: relative; border: 2px solid var(--ink); background: var(--page); cursor: zoom-in; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hide-highlights .overlay { display: none; }
  .shot.missing { display: grid; place-items: center; min-height: 220px; font-size: 13px; cursor: default; }
  .copy { margin-top: 16px; padding: 10px 12px; border: 2px solid var(--ink); max-width: 70ch; }
  .copy del { color: var(--before); background: color-mix(in srgb, var(--before) 10%, transparent); }
  .copy ins { color: var(--after); background: color-mix(in srgb, var(--after) 12%, transparent); text-decoration: none; }
  label.field { display: block; margin: 20px 0 6px; }
  textarea { width: 100%; font: inherit; padding: 10px; border: 2px solid var(--ink); border-radius: 0; background: var(--page); color: var(--ink); resize: vertical; }
  textarea::placeholder { color: var(--placeholder); }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 4px 4px 0 var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .earlier { margin-top: 32px; border-top: 2px solid var(--ink); padding-top: 16px; }
  .earlier h3 { margin: 0 0 10px; }
  .earlier ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .earlier li { display: grid; gap: 4px; }
  .earlier .state.fixed { color: var(--fixed); }
  .earlier .state.open { color: var(--open); }
  .earlier a { color: inherit; }
  .bar { position: fixed; inset: auto 0 0 var(--sidebar); background: var(--page); border-top: 2px solid var(--ink); padding: 12px 40px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bar label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .bar label input { accent-color: var(--ink); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #export-status { font-size: 12px; max-width: 46ch; }
  #export-status:empty { display: none; }
  button { font: inherit; font-size: 13px; font-weight: 700; padding: 7px 12px; border: 2px solid var(--ink); border-radius: 0; background: var(--page); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--ink); color: var(--page); }
  button.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 3px 3px 0 var(--ink); }
  button:disabled { opacity: .3; cursor: default; }
  .export { position: fixed; left: var(--sidebar); right: 0; bottom: 62px; padding: 12px 40px; background: var(--page); border-top: 2px solid var(--ink); }
  .export textarea { height: 130px; font-family: var(--mono); font-size: 12px; }
  .export p { margin: 6px 0 0; font-size: 12px; }
  #lightbox { position: fixed; inset: 0; z-index: 30; background: var(--scrim); overflow: auto; padding: 16px; display: flex; justify-content: center; align-items: flex-start; cursor: zoom-out; }
  #lightbox[hidden] { display: none; }
  #lightbox .shot { width: min(100%, var(--natural)); flex: none; border-color: var(--page); cursor: zoom-out; }
  @media (max-width: 600px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; max-height: 34dvh; border-right: 0; border-bottom: 2px solid var(--ink); } .resize { display: none; } .bar, .export { left: 0; padding: 12px 18px; } main { padding: 20px 18px 200px; } .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<aside>
  <h1 id="title">UI review</h1>
  <p class="round" id="round"></p>
  <nav id="nav" aria-label="Comparisons"></nav>
</aside>
<div class="resize" id="resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
<div id="tip" role="tooltip" hidden></div>
<main>
  <div class="head">
    <div>
      <h2 id="item-title"></h2>
      <div class="meta" id="item-meta"></div>
    </div>
    <label class="looks-good"><span>Looks good</span><input type="checkbox" id="approve"></label>
  </div>
  <p class="explain" id="item-explain"></p>
  <p class="look" id="item-look" hidden></p>
  <p class="gap" id="item-gap" hidden></p>
  <div class="pair" id="pair"></div>
  <div class="copy" id="item-copy" hidden></div>
  <label class="field" for="comment">Comments to address</label>
  <textarea id="comment" rows="3" placeholder="What should change? One request per line."></textarea>
  <section class="earlier" id="earlier" hidden>
    <h3>Earlier comments</h3>
    <ul id="earlier-list"></ul>
  </section>
</main>
<div class="export" id="export-panel" hidden>
  <textarea id="export-text" readonly aria-label="Decisions text"></textarea>
  <p>Select all, copy, and paste this into the thread.</p>
</div>
<div class="bar">
  <label><input type="checkbox" id="highlights" checked> Highlight changes</label>
  <div class="actions">
    <span id="export-status" role="status"></span>
    <button id="prev" type="button">Previous</button>
    <button id="next" type="button">Next</button>
    <button id="export" class="primary" type="button">Copy all decisions</button>
  </div>
</div>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded screenshot" hidden></div>
<script id="review-data" type="application/json">__UI_REVIEW_DATA__</script>
<script>
const FORMAT_DECISIONS = __UI_REVIEW_FORMAT__;
</script>
<script>
const data = JSON.parse(document.getElementById('review-data').textContent);
const approved = new Set(data.items.filter(item => item.approved).map(item => item.id));
const comments = new Map(data.items.map(item => [item.id, '']));
const SIDES = ['Before', 'After'];
const ICONS = {
  desktop: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  tablet: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/>',
  mobile: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
};
const SIDEBAR_KEY = 'ui-review-sidebar';
const SIDEBAR_MIN = 180;
const SIDEBAR_MAX = 560;
const ADVANCE_DELAY_MS = 140;
let current = 0;
let lightboxSide = 0;

const el = id => document.getElementById(id);
const item = () => data.items[current];
const esc = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

el('title').textContent = data.heading;
el('round').textContent = data.round.label + ' · ' + data.items.length + (data.items.length === 1 ? ' comparison' : ' comparisons');

function nav() {
  el('nav').innerHTML = data.groups.map(group => {
    const items = data.items.filter(entry => entry.issueId === group.id);
    if (!items.length) return '';
    return '<details open><summary>' + esc(group.title) + '</summary>' + items.map(entry => {
      const index = data.items.indexOf(entry);
      return '<a class="row" href="#' + encodeURIComponent(entry.id) + '" data-index="' + index + '"' + (index === current ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[entry.device] + '</svg><span>' + esc(entry.title) + '</span></a>';
    }).join('') + '</details>';
  }).join('');
}

function frame(side, label) {
  const rects = side.regions.map(region => '<rect x="' + region.x + '" y="' + region.y + '" width="' + region.width + '" height="' + region.height + '" fill="' + (label === 'Before' ? 'rgba(214,73,73,.14)' : 'rgba(31,122,76,.14)') + '" stroke="' + (label === 'Before' ? 'var(--before)' : 'var(--after)') + '" stroke-width="2" vector-effect="non-scaling-stroke"></rect>').join('');
  return '<div class="shot" data-side="' + SIDES.indexOf(label) + '" style="--natural: ' + side.width + 'px"><img src="' + side.src + '" width="' + side.width + '" height="' + side.height + '" alt="' + label + ' of ' + esc(item().title) + '"><svg viewBox="0 0 ' + side.width + ' ' + side.height + '" preserveAspectRatio="none" class="overlay">' + rects + '</svg></div>';
}

function shot(side, label) {
  return '<figure><figcaption>' + label + '</figcaption>' + (side ? frame(side, label) : '<div class="shot missing">Not captured. See the gap note above.</div>') + '</figure>';
}

function render() {
  const entry = item();
  el('item-title').textContent = entry.title;
  el('item-meta').innerHTML = '<span>' + esc(entry.round) + '</span><span>' + esc(entry.variant) + '</span>';
  el('item-explain').textContent = entry.explanation;
  el('item-look').hidden = !entry.lookAt;
  el('item-look').textContent = entry.lookAt ? 'Look at: ' + entry.lookAt : '';
  el('item-gap').hidden = !entry.gap;
  el('item-gap').textContent = entry.gap || '';
  el('pair').innerHTML = shot(entry.before, 'Before') + shot(entry.after, 'After');
  el('item-copy').hidden = !entry.copyDiff.length;
  el('item-copy').innerHTML = entry.copyDiff.map(segment => segment.type === 'remove' ? '<del>' + esc(segment.text) + '</del>' : segment.type === 'add' ? '<ins>' + esc(segment.text) + '</ins>' : esc(segment.text)).join('');
  el('approve').checked = approved.has(entry.id);
  el('comment').value = comments.get(entry.id);
  el('prev').disabled = current === 0;
  el('next').disabled = current === data.items.length - 1;
  nav();
  history.replaceState(null, '', '#' + encodeURIComponent(entry.id));
}

function go(index) { current = Math.min(Math.max(index, 0), data.items.length - 1); render(); }
function setApproved(value) {
  value ? approved.add(item().id) : approved.delete(item().id);
  el('approve').checked = value;
  if (!value) return;
  const at = current;
  setTimeout(() => { if (current === at && approved.has(item().id) && current < data.items.length - 1) go(current + 1); }, ADVANCE_DELAY_MS);
}
el('prev').onclick = () => go(current - 1);
el('next').onclick = () => go(current + 1);
el('approve').onchange = event => { event.target.blur(); setApproved(event.target.checked); };
el('comment').oninput = event => comments.set(item().id, event.target.value);
el('highlights').onchange = event => document.body.classList.toggle('hide-highlights', !event.target.checked);
el('nav').onclick = event => {
  const link = event.target.closest('a[data-index]');
  if (!link) return;
  event.preventDefault();
  go(Number(link.dataset.index));
};

function showSide(index) {
  const side = [item().before, item().after][index];
  if (!side) return;
  lightboxSide = index;
  el('lightbox').innerHTML = frame(side, SIDES[index]);
}
el('pair').onclick = event => {
  const target = event.target.closest('.shot[data-side]');
  if (!target) return;
  el('lightbox').hidden = false;
  showSide(Number(target.dataset.side));
};
el('lightbox').onclick = () => { el('lightbox').hidden = true; el('lightbox').innerHTML = ''; };

window.addEventListener('keydown', event => {
  if (!el('lightbox').hidden) {
    event.preventDefault();
    if (event.key === 'Escape') el('lightbox').click();
    else if (event.key === 'ArrowLeft') showSide(0);
    else if (event.key === 'ArrowRight') showSide(1);
    return;
  }
  const active = document.activeElement;
  if (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && active.type !== 'checkbox') || active.isContentEditable) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key === 'ArrowRight') go(current + 1);
  else if (event.key === 'ArrowLeft') go(current - 1);
  else if (event.key === 'a' || event.key === 'A') { event.preventDefault(); setApproved(!approved.has(item().id)); }
});
window.addEventListener('hashchange', () => {
  const index = data.items.findIndex(entry => entry.id === decodeURIComponent(location.hash.slice(1)));
  if (index >= 0) go(index);
});

function setSidebar(width) {
  const clamped = Math.round(Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, width)));
  document.documentElement.style.setProperty('--sidebar', clamped + 'px');
  return clamped;
}
try { const saved = Number(localStorage.getItem(SIDEBAR_KEY)); if (saved) setSidebar(saved); } catch (error) {}
const handle = el('resize');
let sidebarWidth = null;
handle.addEventListener('pointerdown', event => {
  event.preventDefault();
  try { handle.setPointerCapture(event.pointerId); } catch (error) {}
  sidebarWidth = setSidebar(event.clientX);
  handle.classList.add('dragging');
  document.body.classList.add('resizing');
});
handle.addEventListener('pointermove', event => { if (sidebarWidth !== null) sidebarWidth = setSidebar(event.clientX); });
const endResize = () => {
  if (sidebarWidth === null) return;
  try { localStorage.setItem(SIDEBAR_KEY, String(sidebarWidth)); } catch (error) {}
  sidebarWidth = null;
  handle.classList.remove('dragging');
  document.body.classList.remove('resizing');
};
handle.addEventListener('pointerup', endResize);
handle.addEventListener('pointercancel', endResize);
handle.addEventListener('dblclick', () => {
  document.documentElement.style.removeProperty('--sidebar');
  try { localStorage.removeItem(SIDEBAR_KEY); } catch (error) {}
});

const tip = el('tip');
el('nav').addEventListener('mouseover', event => {
  const row = event.target.closest('a[data-index]');
  if (!row) return;
  const entry = data.items[Number(row.dataset.index)];
  tip.innerHTML = esc(entry.title) + '<small>' + esc(entry.device) + '</small>';
  tip.hidden = false;
  const box = row.getBoundingClientRect();
  tip.style.left = (document.querySelector('aside').getBoundingClientRect().right + 10) + 'px';
  tip.style.top = Math.max(8, box.top + box.height / 2 - tip.offsetHeight / 2) + 'px';
});
el('nav').addEventListener('mouseleave', () => { tip.hidden = true; });
document.querySelector('aside').addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

if (data.earlier.length) {
  el('earlier').hidden = false;
  el('earlier-list').innerHTML = data.earlier.map(note => '<li><span class="state ' + note.state + '">' + note.state + '</span><span>' + esc(note.round) + ' · ' + (note.target ? '<a href="#' + encodeURIComponent(note.target) + '">' + esc(note.title) + '</a>' : esc(note.title)) + '</span><span>' + esc(note.text) + '</span></li>').join('');
}

function decisionsText() {
  return FORMAT_DECISIONS({
    title: data.title,
    round: data.round.id,
    items: data.items.map(entry => ({ id: entry.id, title: entry.title, approved: approved.has(entry.id), comment: comments.get(entry.id) })),
  });
}

el('export').onclick = async () => {
  const text = decisionsText();
  const box = el('export-text');
  box.value = text;
  el('export-panel').hidden = false;
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch (error) { copied = false; }
  if (!copied) {
    box.focus();
    box.select();
    try { copied = document.execCommand('copy'); } catch (error) { copied = false; }
  }
  el('export-status').textContent = copied
    ? 'Copied. Paste it into the thread now, then close this file.'
    : 'Clipboard blocked. The text is selected above: press \u2318C or Ctrl+C, paste it into the thread, then close this file.';
};

const start = data.items.findIndex(entry => entry.id === decodeURIComponent(location.hash.slice(1)));
current = start >= 0 ? start : 0;
render();
</script>
</body>
</html>
